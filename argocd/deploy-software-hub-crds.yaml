# TODO: Replace <YOUR-REPO-URL> with the URL of your forked GitHub repository.
# Example: https://github.com/your-username/lab3991.git
#
# TODO: Replace <YOUR-NAMESPACE> with your assigned namespace.
# Example: cpd-student1
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deploy-software-hub-crds-student11
  namespace: openshift-gitops
spec:
  project: default

  sources:
    - repoURL: https://github.com/Alejo333/txc-lab3991.git
      targetRevision: main
      path: helm/install-software-hub-crds
      helm:
        releaseName: software-hub-crds-student11
        valueFiles:
          - $overrides/overrides/values.yaml
    - repoURL: https://github.com/Alejo333/txc-lab3991.git
      targetRevision: main
      ref: overrides

  destination:
    server: https://kubernetes.default.svc
    namespace: cpd-student11

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
